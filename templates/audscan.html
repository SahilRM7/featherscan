{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Explore Birds</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <style>
    .card-img-top {
      height: 200px;
      object-fit: cover;
    }

    .card-body {
      display: flex;
      flex-direction: column;
    }

    .card-text {
      flex-grow: 1;
    }

    .audio-player {
      margin-top: auto;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      overflow-x: hidden; /* prevent unwanted scrollbars */
      background-color: white;
    }

    .full-width-wrapper {
      width: 100vw;
      background-color: white;
      margin: 2%;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var scrollpos = window.scrollY;
      var header = document.getElementById("header");
      var navcontent = document.getElementById("nav-content");
      var navaction = document.getElementById("navAction");
      var toToggle = document.querySelectorAll(".toggleColour");

      document.addEventListener("scroll", function () {
        scrollpos = window.scrollY;

        if (scrollpos > 10) {
          header.classList.add("bg-white", "shadow");
          if (navaction) {
            navaction.classList.remove("bg-white");
            navaction.classList.add("gradient", "text-black");
            navaction.classList.remove("text-gray-800");
          }
          toToggle.forEach(function (el) {
            el.classList.add("text-gray-800");
            el.classList.remove("text-white");
          });
          if (navcontent) {
            navcontent.classList.remove("bg-gray-100");
            navcontent.classList.add("bg-white");
          }
        } else {
          header.classList.remove("bg-white", "shadow");
          if (navaction) {
            navaction.classList.remove("gradient", "text-black");
            navaction.classList.add("bg-white", "text-gray-800");
          }
          toToggle.forEach(function (el) {
            el.classList.remove("text-gray-800");
            el.classList.add("text-white");
          });
          if (navcontent) {
            navcontent.classList.add("bg-gray-100");
            navcontent.classList.remove("bg-white");
          }
        }
      });
    });
  </script>

  <body
    class="leading-normal tracking-normal text-black"
    style="background-color: white; margin: 0; padding: 0"
  >
    <div>{% include '_header.html' %}</div>
    <section class="py-20 px-4 bg-white text-gray-800 min-h-screen">
      <header class="bg-green-600 text-white py-6 shadow-md">
        <div class="container mx-auto px-4 text-center">
          <h1 class="text-3xl font-bold">BirdScan 🐦</h1>
          <p class="text-sm mt-1">
            Audio Scan - Identify birds by their sounds 🎧
          </p>
        </div>
      </header>

      <!-- Audio Upload Card -->
      <div class="flex justify-center mt-10">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-xl">
          <h2 class="text-2xl font-semibold text-center text-gray-800 mb-4">
            Upload Bird Audio
          </h2>
          <form method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            <input
              type="file"
              name="audio"
              accept="audio/*"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400"
            />
            <button
              type="submit"
              class="w-full bg-green-600 text-white font-bold py-3 px-4 rounded-full hover:bg-green-700 transition duration-300"
            >
              Scan Audio 🔍
            </button>
          </form>

          {% if result %}
          <div class="mt-6 text-center">
            <h3 class="text-lg font-semibold text-gray-700">
              Prediction Result:
            </h3>
            <p class="mt-2 text-xl text-green-700 font-bold">{{ result }}</p>
          </div>
          {% endif %}
        </div>
      </div>
    </section>
    {% include "_footer.html" %}
  </body>
</html>
