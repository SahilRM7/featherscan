{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Explore Birds</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <style>
    .card-img-top {
      height: 200px;
      object-fit: cover;
    }

    .card-body {
      display: flex;
      flex-direction: column;
    }

    .card-text {
      flex-grow: 1;
    }

    .audio-player {
      margin-top: auto;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      overflow-x: hidden; /* prevent unwanted scrollbars */
      background-color: white;
    }

    .full-width-wrapper {
      width: 100vw;
      background-color: white;
      margin: 2%;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var scrollpos = window.scrollY;
      var header = document.getElementById("header");
      var navcontent = document.getElementById("nav-content");
      var navaction = document.getElementById("navAction");
      var toToggle = document.querySelectorAll(".toggleColour");

      document.addEventListener("scroll", function () {
        scrollpos = window.scrollY;

        if (scrollpos > 10) {
          header.classList.add("bg-white", "shadow");
          if (navaction) {
            navaction.classList.remove("bg-white");
            navaction.classList.add("gradient", "text-black");
            navaction.classList.remove("text-gray-800");
          }
          toToggle.forEach(function (el) {
            el.classList.add("text-gray-800");
            el.classList.remove("text-white");
          });
          if (navcontent) {
            navcontent.classList.remove("bg-gray-100");
            navcontent.classList.add("bg-white");
          }
        } else {
          header.classList.remove("bg-white", "shadow");
          if (navaction) {
            navaction.classList.remove("gradient", "text-black");
            navaction.classList.add("bg-white", "text-gray-800");
          }
          toToggle.forEach(function (el) {
            el.classList.remove("text-gray-800");
            el.classList.add("text-white");
          });
          if (navcontent) {
            navcontent.classList.add("bg-gray-100");
            navcontent.classList.remove("bg-white");
          }
        }
      });
    });
  </script>

  <body
    class="leading-normal tracking-normal text-black"
    style="background-color: white; margin: 0; padding: 0"
  >
    <div>{% include '_header.html' %}</div>
    <section class="py-20 px-4 bg-white text-gray-800 min-h-screen">
      <div class="max-w-4xl mx-auto text-center">
        <h1 class="text-4xl md:text-5xl font-bold mb-6">Image Scan</h1>
        <p class="text-lg md:text-xl text-gray-600 mb-10">
          Upload an image to identify the bird species using AI.
        </p>

        <form
          action="{% url 'predict_image' %}"
          method="POST"
          enctype="multipart/form-data"
          class="bg-gray-100 rounded-lg p-8 shadow-md"
        >
          {% csrf_token %}
          <div class="mb-6">
            <input
              type="file"
              name="bird_image"
              accept="image/*"
              required
              class="block w-full text-sm text-gray-700 border border-gray-300 rounded-lg cursor-pointer bg-white focus:outline-none focus:ring-2 focus:ring-blue-300 p-3"
            />
          </div>
          <button
            type="submit"
            class="bg-gradient-to-r from-blue-400 to-pink-300 text-white font-bold py-3 px-6 rounded-full hover:scale-105 transition-transform duration-300"
          >
            Detect Bird &#128247;
          </button>
        </form>
      </div>
    </section>
    {% include "_footer.html" %}
  </body>
</html>
